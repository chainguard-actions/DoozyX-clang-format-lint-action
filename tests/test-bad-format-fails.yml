name: Test bad formatting - lint fails on poorly formatted code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run clang-format lint on poorly formatted code (expect failure)
        id: lint
        uses: .
        with:
          source: tests/fixtures/src-bad
          extensions: cpp
          clangFormatVersion: '18'
          style: 'Google'
        continue-on-error: true

      - name: Assert lint failed as expected
        env:
          OUTCOME: ${{ steps.lint.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected lint to fail on poorly formatted code, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: lint correctly failed on poorly formatted code"
