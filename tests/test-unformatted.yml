name: Test unformatted code is detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an unformatted C++ file in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-bad-src"
          # Write a file with bad formatting (no spaces, inconsistent indentation)
          printf '#include <iostream>\nint main(){std::cout<<"Hello"<<std::endl;return 0;}\n' \
            > "$GITHUB_WORKSPACE/test-bad-src/bad.cpp"

      - name: Run clang-format lint on unformatted code (expect failure)
        id: action
        uses: .
        with:
          source: test-bad-src
          extensions: 'cpp'
          clangFormatVersion: '18'
          style: 'LLVM'
        continue-on-error: true

      - name: Assert action failed (formatting issues detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on unformatted code, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly detected unformatted code"
